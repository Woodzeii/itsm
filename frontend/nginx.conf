server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: все неизвестные маршруты → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html — без кеша, чтобы обновления приложения подхватывались
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}